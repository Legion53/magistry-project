server:
  port: 8081

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/thesis_inventory
    username: ${DB_USERNAME:thesis}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

otel:
  traces:
    sampler: always_on
    exporter: otlp

  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

  metrics:
    exporter: none

  logs:
    exporter: none

  instrumentation:
    jdbc:
      enabled: true

    spring-web:
      enabled: true

    spring-webmvc:
      enabled: true