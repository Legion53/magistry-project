server:
  port: 8080
  tomcat:
    accept-count: 100

spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  connect-timeout: 1s
  read-timeout: 2s


otel:
  traces:
    sampler: always_on
    exporter: otlp

  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

  metrics:
    exporter: none

  logs:
    exporter: none
  instrumentation:
    spring-web:
      enabled: true

    spring-webmvc:
      enabled: true