server:
  port: 8080
  tomcat:
    accept-count: 100

spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  connect-timeout: 1s
  read-timeout: 2s


otel:
  traces:
    sampler: always_on
    exporter: otlp

  # Explicitly use OTLP/gRPC -> Collector port 4317.
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

  # Metrics and logs are intentionally outside Day 3 scope.
  metrics:
    exporter: none

  logs:
    exporter: none

  # Automatic tracing of incoming/outgoing HTTP.
  instrumentation:
    spring-web:
      enabled: true

    spring-webmvc:
      enabled: true